<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
  </head>

  <body>
    <h2>Registration Form</h2>
    <form action="#">
      <label for="username">Username :</label>
      <input
        type="text"
        placeholder="Enter Username"
        id="username"
        name="username"
      />

      <br /><br />

      <label for="password">Password :</label>
      <input
        type="password"
        placeholder="Enter Password"
        id="password"
        name="password"
      />

      <br /><br />

      <label for="gender">Gender :</label>

      <label for="male">
        <input type="radio" value="male" name="gender" id="male" />Male
      </label>

      <label for="female">
        <input type="radio" value="female" name="gender" id="female" />Female
      </label>

      <br /><br />

      <label for="subjects">Subjects:-</label>

      <br />

      <input type="checkbox" value="daa" id="daa" name="subjects" />
      <label for="daa"> Daa</label>

      <br />

      <input type="checkbox" value="toc" id="toc" name="subjects" />
      <label for="toc">TOC</label>

      <br />

      <input type="checkbox" value="coa" id="coa" name="subjects" />
      <label for="coa">COA </label>

      <br />

      <input type="checkbox" value="cn" id="cn" name="subjects" />
      <label for="cn">CN</label>

      <br />

      <input type="checkbox" value="etc" id="etc" name="subjects" />
      <label for="etc">ETC</label>

      <br />

      <input type="checkbox" value="dbms" id="dbms" name="subjects" />
      <label for="dbms">DBMS</label>

      <br /><br />

      <label for="city">City:</label>
      <select name="city" id="city">
        <option value="hajipur">Hajipur</option>
        <option value="delhi">Delhi</option>
        <option value="patna">Patna</option>
        <option value="ara">Ara</option>
      </select>

      <br /><br />

      <label for="feedback"> Feedback </label><br /><br />
      <textarea
        id="feedback"
        name="feedback"
        rows="5"
        cols="25"
        placeholder="Enter your valuable feedback here."
      ></textarea>

      <br />

      <input type="submit" value="submit" />
    </form>

    <br /><br /><br />

    <div>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/HcOc7P5BMi4?si=HT9e7k9DzwOZsqsa"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>
    <div>
      <video src="free-guy.mp4" width="700px" controls>My video</video>
    </div>
  </body>
</html>
