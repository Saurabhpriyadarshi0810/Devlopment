<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ques 04</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      .box {
        height: 200px;
        width: 200px;
        background-color: aqua;
      }
      .btn {
        height: 100px;
        width: 100px;
        padding: 10px 15px;
        margin: 100px;
        border-color: red;
        border-style: dotted;
        border-radius: 50%;
      }

      .box1 {
        box-sizing: border-box;
        padding: 10px;
        margin: 10px;
        height: 100px;
        width: 125px;
        border: 2px;
        background-color: blue;
      }

      .box2 {
        box-sizing: content-box;
        padding: 10px;
        margin: 10px;
        height: 100px;
        width: 125px;
        border: 2px;
        background-color: rgb(255, 0, 208);
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
    <button class="btn">Click me</button>
    <div class="box1"></div>
    <div class="box2"></div>
  </body>
</html>
